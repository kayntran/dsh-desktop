# Enables the think-tag rewriter.
#
# `name` must be the PACKAGE NAME, not a file path: the engine resolves plugins
# through `createRequire(<profile dir>).resolve('<name>/package.json')`. The
# junction inside the profile's resolution tree is built by
# `src/main/plugin-link.ts`.
- insert:
    - id: hdw-think-tags
      name: harness-desktop-think-tags
