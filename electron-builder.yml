appId: com.harness-desktop.app
productName: Harness Desktop
copyright: MIT. Built on DeepSeek Harness — not affiliated with DeepSeek.

directories:
  output: release

files:
  - dist/**/*
  - resources/**/*
  - package.json

# Engine được chép nguyên khối, không đi qua bộ thu thập phụ thuộc của
# electron-builder. Bộ đó chỉ lần theo `dependencies`, trong khi các gói của dsh
# khai báo phụ thuộc thật bằng `peerDependencies` — cách cũ bỏ sót 214 gói và
# app chết ngay khi khởi động với ERR_MODULE_NOT_FOUND. Ở đây npm đã phân giải
# xong trong `engine/`, việc còn lại chỉ là chép.
#
# runtime/node.exe là Node runtime chính thức mà engine chạy trên đó. Không
# dùng binary Electron ở chế độ Node được: V8 của Electron bật memory cage nên
# N-API không tạo được external ArrayBuffer, và koffi — đường upstream gọi
# dialog chọn thư mục của Windows — cần đúng khả năng đó. Thiếu nó thì tiến
# trình chết hẳn giữa chừng. Lấy về bằng `npm run runtime:install`.
#
# plugins/ cũng phải ra ngoài asar, cùng lý do với engine: engine đọc plugin
# bằng đường dẫn thật trên đĩa từ một tiến trình Node riêng, không nhìn được vào
# asar. Dùng danh sách cho-phép chứ không phải danh sách loại-trừ, để một lần
# `npm install` trong plugin không lỡ kéo cả cây devDependencies vào installer.
# Bỏ file .pdb (ký hiệu gỡ lỗi của node-pty) cắt khoảng 22 MB.
extraResources:
  - from: engine/node_modules
    to: engine/node_modules
  - from: runtime/node.exe
    to: runtime/node.exe
  # pnpm, in its plain JavaScript form. The engine's `dsh plugin add` shells out
  # to `pnpm` from PATH; without one the installer works but installing a plugin
  # dies with "not found". Run on the node.exe above, so nothing else is needed.
  #
  # `artifacts/` is 17.4 MB of build inputs for pnpm's own standalone executable —
  # a thing we do not use — so only `bin/` and `dist/` ship: 19 MB instead of 36.
  # The whole standalone build (@pnpm/win-x64) would have been 93 MB.
  - from: node_modules/pnpm
    to: pnpm
    filter:
      - package.json
      - LICENSE
      - bin/**/*
      - dist/**/*
  - from: plugins/dock
    to: plugins/dock
    filter:
      - package.json
      - cordis.patch.yml
      - lib/**/*
      - '!**/*.map'
  # The panel's two runtime dependencies, each copied by ITS OWN entry, and — this is
  # the part that matters — WITHOUT AN "ONLY TAKE THESE" FILTER.
  #
  # A filter that lists what to include makes electron-builder drop `node_modules`
  # before the list is ever consulted, so `node_modules/ws/**/*` written inside the
  # entry above copied NOTHING. The packaged app carried no `plugins/dock/node_modules`
  # at all and the engine died at startup with `Cannot find package 'ws'`. Two separate
  # entries with `- '**/*'` failed for the same reason. Only-exclude filters (every
  # line starting with `!`) are fine: they leave the default "take everything" in
  # place, which is also why `engine/node_modules` above has always worked.
  #
  # The failure appears ONLY in a packaged build, never in `npm run dev`, where the
  # plugin is loaded straight from the project directory that holds its dependencies.
  # And nothing reports it: `npm run dist` exits 0 and produces an installer that looks
  # perfectly normal. So the check after any packaging change is to RUN THE PACKAGED
  # BUILD — reading the build log proves nothing.
  - from: plugins/dock/node_modules/ws
    to: plugins/dock/node_modules/ws
    filter:
      - '!**/*.map'
  # node-pty ships prebuilt binaries for platforms this app does not target, plus
  # debug symbols; dropping them cuts about 22 MB.
  - from: plugins/dock/node_modules/node-pty
    to: plugins/dock/node_modules/node-pty
    filter:
      - '!prebuilds/darwin-*/**'
      - '!prebuilds/win32-arm64/**'
      - '!**/*.pdb'
      - '!**/*.map'
  # Công tắc bật/tắt plugin. Không có phụ thuộc lúc chạy nào — cả hai nửa đã nằm
  # trong lib/, nên danh sách cho-phép chỉ cần ba dòng.
  - from: plugins/plugin-manager
    to: plugins/plugin-manager
    filter:
      - package.json
      - cordis.patch.yml
      - lib/**/*
      - '!**/*.map'
  # Bộ lọc thẻ <think>. Không có giao diện, không có phụ thuộc lúc chạy.
  - from: plugins/think-tags
    to: plugins/think-tags
    filter:
      - package.json
      - cordis.patch.yml
      - lib/**/*
      - '!**/*.map'
  # Trạm chuyển tiếp MiniMax. Cũng không giao diện, không phụ thuộc lúc chạy.
  - from: plugins/minimax-relay
    to: plugins/minimax-relay
    filter:
      - package.json
      - cordis.patch.yml
      - lib/**/*
      - '!**/*.map'
  # Soul và Memory. Có giao diện, nhưng cả hai nửa đã nằm trong lib/ và không có
  # phụ thuộc lúc chạy nào.
  - from: plugins/growth
    to: plugins/growth
    filter:
      - package.json
      - cordis.patch.yml
      - lib/**/*
      - '!**/*.map'
  # Mặt hiện của việc tự cập nhật: dòng trong Settings và dải nổi khi bản mới đã tải
  # xong. Phần máy móc nằm ở lớp vỏ (`src/main/updater.ts`) — chỉ Electron mới thay
  # được file của chính app. Không phụ thuộc lúc chạy nào.
  - from: plugins/updater
    to: plugins/updater
    filter:
      - package.json
      - cordis.patch.yml
      - lib/**/*
      - '!**/*.map'

# Không biên dịch lại native addon cho ABI của Electron — chúng không chạy
# trong Electron mà trong node.exe ở trên. Cả hai addon trong cây phụ thuộc
# (koffi, node-pty) đều phát hành sẵn bản dựng theo N-API, nên dùng nguyên
# trạng. Bật lại việc biên dịch chỉ đòi hỏi Visual Studio và làm hỏng bản dựng
# sẵn đang chạy tốt.
npmRebuild: false

# Chỉ còn mã của app nằm trong asar; engine đã ra ngoài qua extraResources.
asar: true

# Where the app looks for a newer version of itself, and where `latest.yml` — the
# little file that names the newest version and its hash — gets published beside the
# installer. Without this block electron-builder writes no `app-update.yml` into the
# package, and `src/main/updater.ts` has nothing to read: the check fails on every
# launch instead of reporting "you are up to date".
#
# The repository is public, so no token is needed at runtime.
publish:
  provider: github
  owner: kayntran
  repo: dsh-desktop

win:
  # NSIS ONLY, and the missing `portable` line is the point.
  #
  # A portable build cannot update itself: it unpacks into a temporary folder on
  # every run, so there is no installation for a new version to replace, and
  # electron-builder does not even generate the metadata for one. Publishing both
  # would mean handing half the users a build whose update row can only ever say
  # "download it yourself" — see the `unsupported` phase in `plugins/updater`, which
  # still exists for anyone running the portable 0.1.0 that is already out there.
  target:
    - nsis
  icon: resources/icon.ico
  artifactName: ${productName}-${version}-setup.${ext}

nsis:
  # Cho người dùng thấy và chọn nơi cài, thay vì cài lén vào AppData.
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  # Shortcut trong Start Menu là thứ Windows dùng để gắn AppUserModelID cho app.
  # Không có nó thì mọi thông báo bị hệ điều hành nuốt im lặng.
  shortcutName: Harness Desktop
  uninstallDisplayName: Harness Desktop
  deleteAppDataOnUninstall: false
